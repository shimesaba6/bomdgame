<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時限爆弾モニター</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #setup-screen, #main-screen { text-align: center; width: 100%; }
        #main-screen { display: none; }
        #connect-btn, #restart-btn { padding: 15px 40px; font-size: 24px; font-weight: bold; color: #fff; background-color: #007bff; border: none; border-radius: 8px; cursor: pointer; }
        #timer-display { font-size: 20vw; font-weight: bold; font-family: monospace; }
        #message-display { font-size: 5vw; font-weight: bold; margin-top: 20px; min-height: 8vw; }
        #restart-container { display: none; margin-top: 40px; }
    </style>
</head>
<body>

    <audio id="bgm" src="時計じかけ.mp3" loop></audio>
    <audio id="se-success" src="成功.mp3"></audio>
    <audio id="se-fail" src="爆発.mp3"></audio>

    <div id="setup-screen">
        <h1>【極秘】回路監視システム改</h1>
        <p>Pico2を接続し、下のボタンを押してください</p>
        <button id="connect-btn">システムに接続する</button>
    </div>

    <div id="main-screen">
        <div id="timer-display">---.--</div>
        <div id="message-display">Pico2の起動を待機中...</div>
        <div id="restart-container">
            <button id="restart-btn">ワイヤーを挿して 再挑戦</button>
        </div>
    </div>

    <script>
        let port;
        let reader;
        let writer;
        const setupScreen = document.getElementById('setup-screen');
        const mainScreen = document.getElementById('main-screen');
        const timerDisplay = document.getElementById('timer-display');
        const messageDisplay = document.getElementById('message-display');
        const restartContainer = document.getElementById('restart-container');
        const restartBtn = document.getElementById('restart-btn');
        const bgm = document.getElementById('bgm');
        const seSuccess = document.getElementById('se-success');
        const seFail = document.getElementById('se-fail');

        let timerRunning = false;
        let gameOver = false;
        let bgmStarted = false;
        let startTicks = 0;
        let totalDuration = 0;

        document.getElementById('connect-btn').addEventListener('click', async () => {
            try {
                bgm.volume = 0; bgm.play(); setTimeout(()=> { bgm.pause(); bgm.volume = 1; }, 10);

                // ★【突破ポイント】Raspberry Pi機器（ベンダーID: 0x2e8a）を明示的に指定
                const filters = [
                    { usbVendorId: 0x2e8a }
                ];
                
                port = await navigator.serial.requestPort({ filters });
                await port.open({ baudRate: 115200 });

                setupScreen.style.display = 'none';
                mainScreen.style.display = 'block';
                
                sendStartSignal();
                readLoop();
                requestAnimationFrame(updateDisplay);
                
            } catch (error) {
                console.error(error);
                alert('接続エラー: ' + error.message + '\n設定の「OTG」がオンか、他のアプリがUSBを掴んでいないか確認してください。');
            }
        });

        restartBtn.addEventListener('click', () => {
            gameOver = false; timerRunning = false; bgmStarted = false;
            document.body.style.backgroundColor = "#000";
            timerDisplay.style.color = "#fff";
            timerDisplay.innerText = "180.00";
            messageDisplay.innerText = "Pico2の起動を待機中...";
            restartContainer.style.display = 'none';
            bgm.pause(); bgm.currentTime = 0;
            sendStartSignal();
        });

        async function sendStartSignal() {
            if (port && port.writable) {
                const encoder = new TextEncoder();
                const writer = port.writable.getWriter();
                await writer.write(encoder.encode("S"));
                writer.releaseLock();
            }
        }

        async function readLoop() {
            const decoder = new TextDecoderStream();
            port.readable.pipeTo(decoder.writable);
            const reader = decoder.readable.getReader();
            let buffer = "";
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += value;
                    let lines = buffer.split(/\r?\n/);
                    buffer = lines.pop();
                    for (let line of lines) { processLine(line.trim()); }
                }
            } catch (error) {
                console.error(error);
            } finally { reader.releaseLock(); }
        }

        function processLine(line) {
            if (!line) return;
            if (line === "START_BGM" || (line.startsWith("TIME:") && !bgmStarted)) {
                bgm.play(); bgmStarted = true;
                messageDisplay.innerText = "回路監視システム作動中...";
            }
            if (line.startswith?.("TIME:") || line.includes("TIME:")) {
                if (!timerRunning && !gameOver) {
                    const parts = line.split(":");
                    totalDuration = parseFloat(parts[parts.length - 1]);
                    startTicks = performance.now();
                    timerRunning = true;
                }
            } else if (line.includes("MSG:")) {
                messageDisplay.innerText = line.split(":")[1];
            } else if (line === "MISSION_COMPLETE") {
                bgm.pause(); seSuccess.play();
                timerDisplay.innerText = "CLEAR!";
                timerDisplay.style.color = "#32ff64";
                timerRunning = false; gameOver = true;
                restartContainer.style.display = 'block';
            } else if (line === "MISSION_FAILED") {
                bgm.pause(); seFail.play();
                timerDisplay.innerText = "000.00";
                timerDisplay.style.color = "#ff3232";
                document.body.style.backgroundColor = "#3a0000";
                timerRunning = false; gameOver = true;
                restartContainer.style.display = 'block';
            }
        }

        function updateDisplay() {
            if (timerRunning && !gameOver) {
                let elapsedSec = (performance.now() - startTicks) / 1000.0;
                let currentTime = Math.max(0, totalDuration - elapsedSec);
                timerDisplay.innerText = currentTime.toFixed(2).padStart(6, '0');
            }
            requestAnimationFrame(updateDisplay);
        }
    </script>
</body>
</html>
